# witches add mqtt — config mẫu sinh vào project
mqtt:
  broker_url: tcp://localhost:1883
  client_id: "backend-{{.ServiceName}}"
  username: ""
  password: ""
  keep_alive: 30s
  connect_retry: 5s
  clean_session: true
  qos: 1
  buffer_size: 512
  max_concurrency: 64
  status_topic: "v1/services/{{.ServiceName}}/status"

  # TLS — bỏ comment khi production
  # tls:
  #   ca_file: /etc/ssl/certs/ca.pem
  #   cert_file: /etc/ssl/certs/client.pem
  #   key_file: /etc/ssl/certs/client-key.pem
  #   insecure: false